<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="360" rx="24" fill="#F6FBFF"/>
  <rect x="24" y="24" width="1152" height="312" rx="20" fill="url(#bg)"/>
  <text x="60" y="78" fill="#0F172A" font-family="Arial, sans-serif" font-size="30" font-weight="700">Dreamina Image Workflow</text>
  <text x="60" y="108" fill="#475569" font-family="Arial, sans-serif" font-size="16">Plugin ready, browser logged in, choose model and ratio, generate four images, download locally.</text>

  <g>
    <rect x="60" y="156" width="190" height="116" rx="18" fill="#FFFFFF" stroke="#D6E7F5"/>
    <circle cx="98" cy="194" r="16" fill="#E0F2FE"/>
    <text x="92" y="200" fill="#0369A1" font-family="Arial, sans-serif" font-size="18" font-weight="700">1</text>
    <text x="60" y="228" fill="#0F172A" font-family="Arial, sans-serif" font-size="22" font-weight="700">安装插件</text>
    <text x="60" y="252" fill="#475569" font-family="Arial, sans-serif" font-size="15">Chrome / Edge</text>
    <text x="60" y="272" fill="#475569" font-family="Arial, sans-serif" font-size="15">加载浏览器桥接插件</text>
  </g>

  <g>
    <rect x="286" y="156" width="190" height="116" rx="18" fill="#FFFFFF" stroke="#D6E7F5"/>
    <circle cx="324" cy="194" r="16" fill="#DCFCE7"/>
