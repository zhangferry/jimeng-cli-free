    <circle cx="776" cy="194" r="16" fill="#FCE7F3"/>
    <text x="770" y="200" fill="#BE185D" font-family="Arial, sans-serif" font-size="18" font-weight="700">4</text>
    <text x="738" y="228" fill="#0F172A" font-family="Arial, sans-serif" font-size="22" font-weight="700">网页生图</text>
    <text x="738" y="252" fill="#475569" font-family="Arial, sans-serif" font-size="15">稳定等待任务完成</text>
