    <text x="512" y="228" fill="#0F172A" font-family="Arial, sans-serif" font-size="22" font-weight="700">设置参数</text>
    <text x="512" y="252" fill="#475569" font-family="Arial, sans-serif" font-size="15">模型 / 比例 / 格式</text>
    <text x="512" y="272" fill="#475569" font-family="Arial, sans-serif" font-size="15">默认值可在配置中修改</text>
  </g>

  <g>
