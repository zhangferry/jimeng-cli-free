    <text x="964" y="252" fill="#475569" font-family="Arial, sans-serif" font-size="15">4 张图片保存到 output</text>
    <text x="964" y="272" fill="#475569" font-family="Arial, sans-serif" font-size="15">默认转为 PNG</text>
  </g>

