    <text x="286" y="228" fill="#0F172A" font-family="Arial, sans-serif" font-size="22" font-weight="700">登录即梦</text>
    <text x="286" y="252" fill="#475569" font-family="Arial, sans-serif" font-size="15">浏览器保持登录态</text>
    <text x="286" y="272" fill="#475569" font-family="Arial, sans-serif" font-size="15">无需高阶会员</text>
  </g>

  <g>
